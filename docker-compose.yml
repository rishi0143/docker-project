services:

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

  backend:
    build:
      context: ./backend
    container_name: ecommerce-backend
    expose:
      - "8000"
    environment:
      DB_HOST: db
      POSTGRES_DB: ecommerce
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    depends_on:
      - db
    networks:
      - ecommerce-network

  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

networks:
  ecommerce-network:

volumes:
  postgres-data: