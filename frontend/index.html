<!DOCTYPE html>
<html>
<head>
    <title>Docker 3-Tier Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            font-size: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Docker 3-Tier Application</h1>

    <p>Frontend → Backend → PostgreSQL</p>

    <button onclick="checkBackend()">
        Check Backend
    </button>

    <div id="result"></div>

    <script>
        function checkBackend() {

            fetch("/api")
                .then(response => response.json())
                .then(data => {

                    document.getElementById("result").innerHTML =
                        "<h3>" + data.message + "</h3>" +
                        "<p>" + data.database + "</p>";

                })
                .catch(error => {

                    document.getElementById("result").innerHTML =
                        "<p>Backend connection failed</p>";

                });
        }
    </script>

</body>
</html>
